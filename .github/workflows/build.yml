name: Build CrowControl Mod
on:
  push:
    branches: [ master ]
    tags:
      - '*'

  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Download EverestAPI stripped lib
      uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f
      with:
        repository: EverestAPI/Everest
        latest: true
        fileName: lib-stripped.zip

    - name: Extract Stripped Lib
      run: unzip lib-stripped.zip

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 8

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build Source/CrowControl.csproj --configuration Release --no-restore
      env:
        CelestePrefix: ${{ github.workspace }}/lib-stripped

    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: CrowControl
        retention-days: 20
        path: |
          everest.yaml
          bin
          Ahorn/**/*
          Audio/**/*
          Dialog/**/*
          Graphics/**/*
          Loenn/**/*

    - name: Make Zip
      if: startsWith(github.ref, 'refs/tags/')
      uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554
      with:
        type: "zip"
        filename: "CrowControl.zip"
        exclusions: "/third-party/* /Source/* /lib-stripped/* *.git* *.sln *.md .everestignore *.zip"

    - name: Make Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
      with:
        artifacts: "CrowControl.zip"
        allowUpdates: true
        generateReleaseNotes: true
        omitNameDuringUpdate: true
        makeLatest: "legacy"
        draft: false
